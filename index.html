<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which of the twelve is yours? A Jungian typology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E4E9E6; --card:#F1F4F1; --ink:#1D2B4F; --muted:#56617E;
  --gold:#A8761C; --gold-soft:rgba(168,118,28,.22); --red:#9C3B2E; --line:#C2CBC6;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#172342; --card:#1F2E54; --ink:#E7EAF3; --muted:#9FAAC8;
    --gold:#DBA645; --gold-soft:rgba(219,166,69,.25); --red:#E48C7B; --line:#35467A;
  }
}
:root[data-theme="dark"]{
  --bg:#172342; --card:#1F2E54; --ink:#E7EAF3; --muted:#9FAAC8;
  --gold:#DBA645; --gold-soft:rgba(219,166,69,.25); --red:#E48C7B; --line:#35467A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:28px 20px 56px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.12;margin:0;letter-spacing:-.01em}
p{margin:0 0 1em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Intro */
.mandala{width:min(78vw,300px);display:block;margin:8px auto 22px}
.intro h1{font-size:clamp(2.1rem,9vw,3rem);font-weight:800;text-align:center}
.intro .sub{font-family:var(--serif);font-style:italic;text-align:center;color:var(--muted);font-size:1.15rem;margin:10px 0 26px}
.facts{display:grid;gap:10px;margin:0 0 26px;padding:0;list-style:none}
.facts li{padding:12px 16px;background:var(--card);border-left:4px solid var(--gold);border-radius:0 10px 10px 0}
.facts b{font-weight:600}
.btn{display:block;width:100%;padding:16px 20px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:1.05rem;letter-spacing:.01em}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);margin-top:12px}
.fine{font-size:.85rem;color:var(--muted);text-align:center;margin-top:18px}

/* Quiz */
.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.back{background:none;border:0;padding:6px 8px;margin-left:-8px;color:var(--muted);font-weight:500}
.back[disabled]{opacity:.3;cursor:default}
.track{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--gold);width:0;transition:width .35s ease}
.count{font-size:.9rem;color:var(--muted);min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.phase{font-family:var(--serif);font-style:italic;color:var(--gold);margin-bottom:6px}
.q{font-size:clamp(1.55rem,6.4vw,2rem);margin-bottom:22px}
.opts{display:grid;gap:12px}
.opt{text-align:left;padding:16px 18px;background:var(--card);border:2px solid var(--line);border-radius:14px;line-height:1.4;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gold)}
.opt.picked{border-color:var(--gold);background:var(--gold-soft)}

/* Result */
.result .kicker{font-family:var(--serif);font-style:italic;color:var(--gold);text-align:center;margin-bottom:4px}
.type{font-family:var(--serif);font-weight:800;font-size:clamp(3.4rem,17vw,5rem);text-align:center;letter-spacing:.04em;line-height:1}
.typename{font-family:var(--serif);text-align:center;font-size:1.5rem;margin:6px 0 14px}
.lede{text-align:center;color:var(--muted);max-width:44ch;margin:0 auto 6px}
.compass{width:min(92vw,340px);display:block;margin:10px auto 6px}
.compass text{font-family:var(--sans);fill:var(--muted);font-size:12.5px}
.compass .strong{fill:var(--ink);font-weight:600}
.compass .stack{font-family:var(--serif);font-size:15px;font-weight:600;fill:var(--ink)}
.sec{margin-top:34px}
.sec h2{font-size:1.5rem;margin-bottom:10px}
.stackrow{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.stackrow dt{font-family:var(--serif);font-weight:800;font-size:1.3rem;color:var(--gold)}
.stackrow dd{margin:0 0 8px}
.axis{display:grid;grid-template-columns:2rem 1fr 2rem;align-items:center;gap:10px;margin:10px 0}
.axis span{font-family:var(--serif);font-weight:600;text-align:center}
.axis .on{color:var(--gold);font-weight:800}
.bar{position:relative;height:6px;background:var(--line);border-radius:6px}
.bar i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--gold);border:3px solid var(--bg);transform:translate(-50%,-50%)}
.arch{padding:20px;background:var(--card);border-radius:18px;border-top:5px solid var(--gold)}
.arch h3{font-size:2rem;margin-bottom:8px}
.shadow{padding:20px;border-radius:18px;border:2px dashed var(--red)}
.shadow h3{font-size:1.4rem;margin-bottom:8px;color:var(--red)}
.blend{display:grid;gap:9px}
.blend div{display:grid;grid-template-columns:5.6rem 1fr 2.6rem;align-items:center;gap:10px;font-size:.95rem}
.blend .b{height:10px;background:var(--line);border-radius:10px;overflow:hidden}
.blend .b i{display:block;height:100%;background:var(--gold)}
.blend em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.copybox{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;resize:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script>
/* ---------- DATA ---------- */
const JUNG = [
  {ax:'EI', q:'After a long week, what recharges you?', a:['E','Time with people. Dinner, a crowd, a conversation that runs late.'], b:['I','Time alone with my own thoughts.']},
  {ax:'SN', q:'Which do you trust more?', a:['S','What has been proven and what I can observe directly.'], b:['N','A hunch about where things are heading.']},
  {ax:'TF', q:'A friend shows you a plan with a real flaw. You:', a:['T','Name the flaw plainly. Clarity is the kind thing to do.'], b:['F','Raise it gently and think first about how they will take it.']},
  {ax:'JP', q:'What does your ideal weekend look like?', a:['J','Planned, with a few things finished and checked off.'], b:['P','Open. I decide as the day unfolds.']},
  {ax:'EI', q:'In a meeting, you tend to:', a:['E','Think out loud and find the idea by talking.'], b:['I','Think it through first, then speak once.']},
  {ax:'SN', q:'You would rather read:', a:['S','A practical guide with concrete steps.'], b:['N','A big idea about how the world works.']},
  {ax:'TF', q:'A good decision is one that:', a:['T','Holds up logically, whoever it upsets.'], b:['F','Fits your values and the people it touches.']},
  {ax:'JP', q:'Deadlines. Which is you?', a:['J','Finish early and breathe easy.'], b:['P','Do my best work near the edge.']},
  {ax:'EI', q:'Your circle of friends is:', a:['E','Wide. New people are easy to add.'], b:['I','Small and deep. A few people know the real me.']},
  {ax:'SN', q:'Learning something new, your first question is:', a:['S','How does this work in practice?'], b:['N','What larger pattern does this belong to?']},
  {ax:'TF', q:'Which bothers you more?', a:['T','Sloppy reasoning.'], b:['F','Coldness.']},
  {ax:'JP', q:'Plans change at the last minute. You feel:', a:['J','Irritated. I would rather have it settled.'], b:['P','Energized. More options are open.']}
];

const ARCH = {
  King:{pair:'Outsider', line:'You orient around order and responsibility. You want the whole system to work, and you step up to hold it together.'},
  Warrior:{pair:'Healer', line:'You meet difficulty head on. Discipline, courage, and follow-through are how you show care.'},
  Sage:{pair:'Joker', line:'You need to understand. You would rather be right slowly than wrong quickly.'},
  Rebel:{pair:'Judge', line:'You test what everyone else accepts. Where others see a rule, you see a question about who it serves.'},
  Lover:{pair:'Guardian', line:'You live through attachment, taste, and intensity. Depth of connection decides what matters.'},
  Builder:{pair:'Explorer', line:'You think in structures and results. An idea counts once it exists in the world.'},
  Guardian:{pair:'Lover', line:'You protect. Stability, loyalty, and keeping people safe come before your own comfort.'},
  Explorer:{pair:'Builder', line:'You need the horizon. New ground, new ideas, and room to move keep you alive.'},
  Joker:{pair:'Sage', line:'You see the absurd and put it to use. Humor is how you tell the truth and keep a group human.'},
  Healer:{pair:'Warrior', line:'You notice pain and move toward it. You help people become whole, often at your own expense.'},
  Judge:{pair:'Rebel', line:'You weigh. Fairness, standards, and clean reasoning guide you, and you cannot unsee a double standard.'},
  Outsider:{pair:'King', line:'You stand slightly apart and see the room clearly. Belonging on your own terms matters more than belonging.'}
};

const AQ = [
  {q:'Your team is stuck. You:', o:[['King','Make the call and own the outcome.'],['Warrior','Push through. Effort breaks deadlocks.'],['Sage','Step back and study how the problem is built.'],['Joker','Break the tension with a joke and reset the room.']]},
  {q:'What do you fear most?', o:[['Outsider','Being absorbed into a crowd that does not see me.'],['Guardian','Failing people who depend on me.'],['Builder','Making something that does not last.'],['Judge','Letting something unjust stand.']]},
  {q:'A perfect day off:', o:[['Explorer','Somewhere I have never been.'],['Lover','A long dinner with someone I am close to.'],['Healer','Helping a friend through something hard.'],['Rebel','Breaking a rule that deserves breaking.']]},
  {q:'People come to you for:', o:[['Sage','Perspective.'],['King','Direction.'],['Healer','Comfort.'],['Builder','Results.']]},
  {q:'In a conflict, you:', o:[['Warrior','Stand and fight.'],['Guardian','Put myself between the conflict and the vulnerable.'],['Judge','Weigh the evidence and rule fairly.'],['Outsider','Walk away and do it my own way.']]},
  {q:'What gives your work meaning?', o:[['Builder','Leaving something solid behind.'],['Explorer','Discovering what no one has.'],['Lover','Making something beautiful or deeply felt.'],['Joker','Making people feel lighter.']]},
  {q:'An old institution is failing. You:', o:[['Rebel','Tear it down and start over.'],['King','Take charge and reform it.'],['Guardian','Preserve what is worth keeping.'],['Judge','Find out who is accountable.']]},
  {q:'Your friends would call you:', o:[['Healer','Gentle.'],['Warrior','Fierce.'],['Outsider','Hard to categorize.'],['Explorer','Restless.']]},
  {q:'Whom do you admire most?', o:[['Sage','Someone who understands deeply.'],['Lover','Someone who loves fully.'],['Warrior','Someone who endures.'],['Guardian','Someone who protects others.']]},
  {q:'When life gets hard, you:', o:[['Guardian','Hold the line and look after others.'],['Explorer','Hit the road.'],['Joker','Laugh, because the alternative is worse.'],['Healer','Look for the lesson and the repair.']]},
  {q:'Which sentence sounds most like you?', o:[['Rebel','A rule has to earn its place.'],['Judge','Standards matter.'],['Builder','I would rather make it than talk about it.'],['Outsider','I see it differently than most.']]},
  {q:'What do you want most?', o:[['King','Order and a legacy.'],['Lover','Real intimacy.'],['Sage','The truth.'],['Joker','A good time with good people.']]}
];

const TYPES = {
  INTJ:['The Strategist','You see the long arc and build a plan to meet it.'],
  INTP:['The Theorist','You take ideas apart until the logic shows.'],
  ENTJ:['The Commander','You organize people and resources around a goal.'],
  ENTP:['The Provocateur','You test every idea by arguing the other side.'],
  INFJ:['The Counselor','You read people and patterns, and you hold a quiet vision.'],
  INFP:['The Idealist','You live by an inner compass and a deep sense of meaning.'],
  ENFJ:['The Mentor','You draw out what people can become.'],
  ENFP:['The Catalyst','You see possibility in people and set things moving.'],
  ISTJ:['The Steward','You keep your word and keep things running.'],
  ISFJ:['The Protector','You remember what matters to people and quietly serve it.'],
  ESTJ:['The Administrator','You bring structure, standards, and follow-through.'],
  ESFJ:['The Harmonizer','You tend the group and keep everyone connected.'],
  ISTP:['The Craftsman','You learn by handling the thing itself.'],
  ISFP:['The Free Spirit','You act on taste and feeling, gently and without announcement.'],
  ESTP:['The Operator','You read the moment and act in it.'],
  ESFP:['The Performer','You bring energy and presence to whatever is in front of you.']
};

const FN = {
  Te:'Extraverted Thinking: organizing the outer world by logic, measures, and results.',
  Ti:'Introverted Thinking: building an internal framework that must be consistent.',
  Fe:'Extraverted Feeling: reading and tuning to the emotional climate of a group.',
  Fi:'Introverted Feeling: weighing everything against deeply held personal values.',
  Se:'Extraverted Sensation: full contact with the present moment and its details.',
  Si:'Introverted Sensation: comparing now against a rich memory of what has been.',
  Ne:'Extraverted Intuition: seeing possibilities and connections everywhere.',
  Ni:'Introverted Intuition: converging on a single deep insight about where things lead.'
};

/* ---------- STATE ---------- */
let steps, answers, idx;
const app = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function start(){
  const j = JUNG.map(x => ({kind:'jung', ax:x.ax, q:x.q, o: shuffle([x.a, x.b])}));
  const a = AQ.map(x => ({kind:'arch', q:x.q, o: shuffle(x.o)}));
  steps = [...j, ...a]; answers = []; idx = 0;
  renderQ();
}

/* ---------- RENDER ---------- */
function mandala(){
  return `<svg class="mandala" viewBox="0 0 300 300" role="img" aria-label="A mandala with four functions: Thinking, Feeling, Sensation, Intuition">
  <g fill="none" stroke="var(--ink)" stroke-width="1.5">
    <circle cx="150" cy="150" r="138"/><circle cx="150" cy="150" r="104" stroke="var(--gold)" stroke-width="2"/>
    <circle cx="150" cy="150" r="60"/>
    <rect x="70" y="70" width="160" height="160" transform="rotate(45 150 150)" stroke="var(--gold)"/>
    <line x1="150" y1="12" x2="150" y2="288"/><line x1="12" y1="150" x2="288" y2="150"/>
  </g>
  <g fill="var(--ink)" font-family="Fraunces,Georgia,serif" font-size="13" text-anchor="middle" font-weight="600">
    <text x="150" y="8">Thinking</text><text x="150" y="298">Feeling</text>
    <text x="30" y="154" transform="rotate(-90 20 150)">Sensation</text><text x="280" y="154" transform="rotate(90 280 150)">Intuition</text>
  </g>
  <circle cx="150" cy="150" r="8" fill="var(--gold)"/></svg>`;
}

function renderIntro(){
  app.innerHTML = `<section class="intro">
    ${mandala()}
    <h1>Which of the twelve is yours?</h1>
    <p class="sub">A Jungian read on how you perceive, decide, and show up.</p>
    <ul class="facts">
      <li><b>24 questions</b>, about four minutes. Pick the answer closest to you, even if neither fits perfectly.</li>
      <li><b>Your Jungian type</b> and the function you lead with, drawn on a compass.</li>
      <li><b>Your archetype</b> among twelve, plus its shadow: the one you claim least.</li>
    </ul>
    <button class="btn" id="go">Begin</button>
    <p class="fine">For reflection and conversation, not a clinical measurement. Nothing you answer leaves this page.</p>
  </section>`;
  document.getElementById('go').onclick = start;
}

function renderQ(){
  const s = steps[idx];
  const pct = (idx/steps.length)*100;
  const phase = s.kind==='jung' ? 'Part one: how you operate' : 'Part two: who you are in action';
  app.innerHTML = `<section>
    <div class="top">
      <button class="back" id="back" ${idx===0?'disabled':''} aria-label="Previous question">Back</button>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${steps.length}" aria-valuenow="${idx}"><div class="fill" style="width:${pct}%"></div></div>
      <div class="count">${idx+1}/${steps.length}</div>
    </div>
    <div class="phase">${phase}</div>
    <h2 class="q">${s.q}</h2>
    <div class="opts">${s.o.map((o,i)=>`<button class="opt ${answers[idx]===o[0]+'|'+i?'picked':''}" data-v="${o[0]}" data-i="${i}">${o[1]}</button>`).join('')}</div>
  </section>`;
  requestAnimationFrame(()=>{ const f=app.querySelector('.fill'); if(f) f.style.width=((idx+1)/steps.length*100)+'%'; });
  document.getElementById('back').onclick = () => { if(idx>0){ idx--; renderQ(); } };
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    answers[idx] = b.dataset.v+'|'+b.dataset.i;
    b.classList.add('picked');
    setTimeout(() => { idx++; idx < steps.length ? renderQ() : renderResult(); window.scrollTo(0,0); }, 180);
  });
}

/* ---------- SCORING ---------- */
function score(){
  const L = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  const A = {}; const seen = {};
  Object.keys(ARCH).forEach(k => {A[k]=0; seen[k]=0;});
  steps.forEach((s,i) => {
    const v = answers[i].split('|')[0];
    if (s.kind==='jung') L[v]++;
    else A[v]++;
  });
  AQ.forEach(q => q.o.forEach(o => seen[o[0]]++));
  const norm = {}; let total = 0;
  Object.keys(A).forEach(k => { norm[k] = A[k]/seen[k]; total += norm[k]; });
  return {L, norm, total};
}

function stack(code){
  const e = code[0]==='E', judging = code[2], perceiving = code[1], isJ = code[3]==='J';
  const att = x => x ? 'e' : 'i';
  let dom, aux;
  if (isJ) { if (e) { dom = judging+'e'; aux = perceiving+'i'; } else { dom = perceiving+'i'; aux = judging+'e'; } }
  else { if (e) { dom = perceiving+'e'; aux = judging+'i'; } else { dom = judging+'i'; aux = perceiving+'e'; } }
  const opp = {T:'F',F:'T',S:'N',N:'S'};
  const inf = opp[dom[0]] + (dom[1]==='e'?'i':'e');
  return {dom, aux, inf};
}

function compassSVG(L, st){
  const R = 108, c = 160;
  const val = n => 0.22 + 0.78*(n/3);
  const t = val(L.T), f = val(L.F), s = val(L.S), n = val(L.N);
  const pts = [[c, c - t*R],[c + n*R, c],[c, c + f*R],[c - s*R, c]];
  const poly = pts.map(p => p.map(x=>x.toFixed(1)).join(',')).join(' ');
  const dom = {T:pts[0],N:pts[1],F:pts[2],S:pts[3]}[st.dom[0]];
  const label = (x,y,txt,strong,anchor='middle') => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${strong?'strong':''}">${txt}</text>`;
  const dl = k => st.dom[0]===k;
  return `<svg class="compass" viewBox="0 0 320 320" role="img" aria-label="Compass of your four functions with dominant function ${st.dom}">
    <g fill="none" stroke="var(--line)" stroke-width="1.5">
      <circle cx="160" cy="160" r="${R}"/><circle cx="160" cy="160" r="${R*0.61}"/><circle cx="160" cy="160" r="${R*0.22}"/>
      <line x1="160" y1="${160-R}" x2="160" y2="${160+R}"/><line x1="${160-R}" y1="160" x2="${160+R}" y2="160"/>
    </g>
    <polygon points="${poly}" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="${dom[0]}" cy="${dom[1]}" r="9" fill="var(--gold)" stroke="var(--bg)" stroke-width="3"/>
    ${label(160,22,'Thinking',dl('T'))}${label(160,308,'Feeling',dl('F'))}
    ${label(8,164,'Sensation',dl('S'),'start')}${label(312,164,'Intuition',dl('N'),'end')}
  </svg>`;
}

function renderResult(){
  const {L, norm, total} = score();
  const code = (L.E>=2?'E':'I')+(L.S>=2?'S':'N')+(L.T>=2?'T':'F')+(L.J>=2?'J':'P');
  const [tname, tline] = TYPES[code];
  const st = stack(code);
  const ranked = Object.entries(norm).sort((a,b)=>b[1]-a[1]);
  const top = ranked[0][0], shadow = ARCH[top].pair;
  const axisRow = (a,b,ca,cb) => {
    const pos = Math.min(92, Math.max(8, (cb/3)*100));
    const win = ca>=2?a:b;
    return `<div class="axis"><span class="${win===a?'on':''}">${a}</span><div class="bar"><i style="left:${pos}%"></i></div><span class="${win===b?'on':''}">${b}</span></div>`;
  };
  const share = `My Jungian type: ${code} (${tname}), dominant function ${st.dom}. Archetype: ${top}. Shadow: ${shadow}.`;

  app.innerHTML = `<section class="result">
    <div class="kicker">Your Jungian type</div>
    <div class="type">${code}</div>
    <div class="typename">${tname}</div>
    <p class="lede">${tline}</p>
    ${compassSVG(L, st)}

    <div class="sec"><h2>How your functions line up</h2>
      <dl class="stackrow">
        <dt>${st.dom}</dt><dd><b>Leads.</b> ${FN[st.dom]}</dd>
        <dt>${st.aux}</dt><dd><b>Supports.</b> ${FN[st.aux]}</dd>
        <dt>${st.inf}</dt><dd><b>Least developed.</b> ${FN[st.inf]} Stress tends to expose it.</dd>
      </dl>
    </div>

    <div class="sec"><h2>Where you land on each pair</h2>
      ${axisRow('E','I',L.E,L.I)}${axisRow('S','N',L.S,L.N)}${axisRow('T','F',L.T,L.F)}${axisRow('J','P',L.J,L.P)}
    </div>

    <div class="sec"><h2>Your archetype</h2>
      <div class="arch"><h3>The ${top}</h3><p>${ARCH[top].line}</p>
        <div class="blend">${ranked.slice(0,4).map(([k,v])=>`<div><span>${k}</span><span class="b"><i style="width:${Math.round(v/total*100*2.2)}%"></i></span><em>${Math.round(v/total*100)}%</em></div>`).join('')}</div>
      </div>
    </div>

    <div class="sec"><div class="shadow"><h3>Your shadow: The ${shadow}</h3>
      <p>${ARCH[shadow].line}</p>
      <p style="margin:0">In Jung's account, the shadow holds what you least claim as yours. You tend to notice it in other people first, and it is where the most growth sits.</p></div>
    </div>

    <div class="sec">
      <button class="btn" id="copy">Copy my result</button>
      <textarea class="copybox" id="box" rows="3" readonly hidden>${share}</textarea>
      <button class="btn ghost" id="again">Retake</button>
      <p class="fine">Jung described eight cognitive functions. The four-letter code is a later popularization of his work, and the twelve archetypes are a common modern grouping. Treat all of it as a mirror, not a verdict.</p>
    </div>
  </section>`;

  document.getElementById('again').onclick = () => { window.scrollTo(0,0); renderIntro(); };
  document.getElementById('copy').onclick = async () => {
    const btn = document.getElementById('copy'), box = document.getElementById('box');
    try { await navigator.clipboard.writeText(share); btn.textContent = 'Copied'; }
    catch(e) { box.hidden = false; box.select(); btn.textContent = 'Select and copy below'; }
  };
}

renderIntro();
</script>
</body>
</html>
